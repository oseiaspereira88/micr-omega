name: Validate Pull Requests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Worker dry run deploy
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --workspace worker wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build web app
        run: npm run build:web

      - name: Publish Pages preview
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        id: pages-preview
        run: npx wrangler pages deploy ./web/dist --project-name "${{ secrets.CLOUDFLARE_PAGES_PROJECT || 'micr-omega' }}" --branch "${{ github.head_ref || github.ref_name }}" --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Append preview URLs to summary
        if: ${{ steps.pages-preview.outputs.deployment-url != '' }}
        env:
          DEPLOYMENT_URL: ${{ steps.pages-preview.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.pages-preview.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "## Cloudflare Pages preview";
            echo "";
            echo "- Deployment: ${DEPLOYMENT_URL}";
            if [ -n "${ALIAS_URL}" ]; then
              echo "- Alias: ${ALIAS_URL}";
            fi
          } >> "$GITHUB_STEP_SUMMARY"
