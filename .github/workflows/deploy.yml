name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare Token
        id: check-token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning ::CLOUDFLARE_API_TOKEN não está configurado nos Repository Secrets do GitHub. Acesse Settings -> Secrets and variables -> Actions e adicione CLOUDFLARE_API_TOKEN para habilitar o deploy automático do Worker."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Worker
        if: steps.check-token.outputs.has_token == 'true'
        run: npx --workspace worker wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy Pages
    needs: deploy-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

      - name: Check Cloudflare Token
        id: check-token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning ::CLOUDFLARE_API_TOKEN não está configurado nos Repository Secrets do GitHub. O build do web app foi compilado com sucesso, mas o deploy para Cloudflare Pages foi pausado aguardando o secret."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Pages
        if: steps.check-token.outputs.has_token == 'true'
        run: npx wrangler pages deploy ./web/dist --project-name "${{ secrets.CLOUDFLARE_PAGES_PROJECT || secrets.CF_PAGES_PROJECT || 'micr-omega' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}


